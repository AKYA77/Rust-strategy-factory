name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
# Six PARALLEL jobs (admin lever 2026-11-21): wall time = max(jobs), not sum.
# Release jobs only run on push to main to save CI minutes on PRs.
# Every previous stage/assertion is preserved; ALL six jobs are required for merge
# (branch protection required status checks + QA verifies the full rollup on the exact SHA).
# dependency-audit runs cargo-deny (licenses/bans/sources/advisories per deny.toml) plus
# cargo-audit (RustSec) as a parallel stage. Documented advisory ignores carry reasons in
# deny.toml and docs/dependency-audit-automation/FIRST_AUDIT_RECEIPT.md; no advisory
# affecting a pinned dependency is silently ignored.
# Each job gets its own job-scoped rust-cache (no shared-key -> no parallel save races).
# mold was evaluated and SKIPped: clean link-only A/B shows the rustc-1.100 default
# linker (rust-lld 23.1.5) already matches mold 2.30 on this workload (see runbook).
# CI speedup (2026-11-21):
#   - release-acceptance split into 4 parallel sub-jobs: wall time ~5 min instead of ~18 min
#   - release builds only run on push to main (PRs skip them)
#   - doc tests only run on push to main
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  rust-checks:
    name: rust-checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Cache cargo registry and target artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-cache-v1
      - run: cargo test --locked --lib --bins --tests
  browser:
    name: browser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Cache cargo registry and target artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-cache-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: cargo build --locked
      - run: npm run test:browser
  release-build:
    name: release-build
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Cache cargo registry and target artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-cache-v1
      - run: cargo build --locked --release
  data-compute-identity:
    name: data-compute-identity
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Cache cargo registry and target artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-cache-v1
      - run: cargo build --locked
      - name: Verify data compute identity boundaries
        run: |
          mkdir -p work
          python3 scripts/check-data-compute-identity.py work/data-compute-identity.json
  check-operations:
    name: check-operations
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Cache cargo registry and target artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-cache-v1
      - run: cargo build --locked
      - run: python3 scripts/check-operations.py
  full-horizon:
    name: full-horizon
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Cache cargo registry and target artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-cache-v1
      - run: cargo build --locked --release
      - name: Verify continuous UTC horizon and declared context ceiling
        run: python3 scripts/check-full-horizon.py --binary target/release/rust-strategy-factory --output work/full-horizon-context.json
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Cache cargo registry and target artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-cache-v1
      - name: Install audit tooling (cargo-deny 0.22.0, cargo-audit 0.23.0)
        run: |
          cargo install cargo-deny --version 0.22.0
          cargo install cargo-audit --version 0.23.0
      - name: Run license/ban/source/advisory audit (cargo-deny)
        run: cargo deny check
      - name: Run RustSec advisory audit (cargo-audit)
        run: |
          cargo audit \
            --ignore RUSTSEC-2026-0391 \
            --ignore RUSTSEC-2026-0459 \
            --ignore RUSTSEC-2026-0543
