name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
# Quality-neutral CI throughput settings (docs/RUNBOOKS/verification-throughput.md):
# incremental off (CI artifacts are cached whole, not incrementally), no debug info in CI
# (panic locations and symbol names remain; local profiles keep line tables for backtraces).
# Neither variable is bound by build.rs compute identity, so CI and local identities match.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
# Three PARALLEL jobs (admin lever 2026-11-20): wall time = max(jobs), not sum.
# Every previous stage/assertion is preserved; ALL three jobs are required for merge
# (branch protection required status checks + QA verifies the full rollup on the exact SHA).
# Each job gets its own job-scoped rust-cache (no shared-key -> no parallel save races).
# mold was evaluated and SKIPped: clean link-only A/B shows the rustc-1.100 default
# linker (rust-lld 23.1.5) already matches mold 2.30 on this workload (see runbook).
jobs:
  rust-checks:
    name: rust-checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Cache cargo registry and target artifacts
        uses: Swatinem/rust-cache@v2
      - run: sh scripts/check.sh
      - name: Verify trusted inventory cannot deserialize supplied JSON
        run: cargo test --locked --doc
  browser:
    name: browser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Cache cargo registry and target artifacts
        uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: cargo build --locked
      - run: npm run test:browser
  release-acceptance:
    name: release-acceptance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Cache cargo registry and target artifacts
        uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - name: Verify data compute identity boundaries
        run: |
          mkdir -p work
          python3 scripts/check-data-compute-identity.py work/data-compute-identity.json
      - run: cargo build --locked --release
      - run: python3 scripts/check-operations.py
      - name: Verify continuous UTC horizon and declared context ceiling
        run: python3 scripts/check-full-horizon.py --binary target/release/rust-strategy-factory --output work/full-horizon-context.json
