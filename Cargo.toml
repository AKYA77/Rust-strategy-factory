[package]
name = "rust-strategy-factory"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "Deterministic historical strategy research; no live trading"

[dependencies]
parquet = { version = "=60.1.0", default-features = false, features = ["zstd"] }
bytes = "1"
zstd = { version = "=0.13.3", default-features = false }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
argon2 = "0.5"
getrandom = "0.3"
constant_time_eq = "0.4"
blake3 = "1.8"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
csv = "1.4"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip"] }
fs2 = "=0.4.3"
sha2 = "=0.11.1"

[profile.release]
lto = "thin"
codegen-units = 1

# Verification-throughput profiles (quality-neutral; docs/RUNBOOKS/verification-throughput.md).
# Exact integer accounting is unchanged: Rust has no fast-math, and these profiles only
# change optimization/debug-info levels, never source semantics. Compute identity binds
# Cargo.toml bytes, so this is an honest build-metadata revision change (documented).
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Dependencies optimized once and cached; test binaries inherit these overrides.
[profile.dev.package."*"]
opt-level = 2
debug = false

# Faster build scripts/proc-macros at execution time (incl. bundled SQLite C compilation).
[profile.dev.build-override]
opt-level = 3

# Test code (lib/bin/integration harnesses) optimized for the CPU-bound real-data suites.
[profile.test]
opt-level = 1

[lints.rust]
unsafe_code = "forbid"

[[bench]]
name = "replay"
harness = false

[build-dependencies]
blake3 = "1.8"

