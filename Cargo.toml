[package]
name = "rust-strategy-factory"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "Deterministic historical strategy research; no live trading"

[dependencies]
blake3 = "1.8"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
csv = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
