[package]
name = "rust-strategy-factory"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "Deterministic historical strategy research; no live trading"

[dependencies]
zstd = { version = "=0.13.3", default-features = false }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
argon2 = "0.5"
getrandom = "0.3"
constant_time_eq = "0.4"
blake3 = "1.8"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
csv = "1.4"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[[bench]]
name = "replay"
harness = false

[build-dependencies]
blake3 = "1.8"

[[bench]]
name = "mask_prefix"
harness = false

[[bench]]
name = "exploration"
harness = false

[[bench]]
name = "compressed"
harness = false
